site_name: Biola-X
site_description: >-
  Biola-X is Biola University Engineering's umbrella initiative for industry-
  connected work: the Engineering Senior Capstone, Summer Engineering Internships,
  and Industry Partnerships.
site_author: Biola University Engineering

# GitHub Pages URL for the Biola-X/capstone repository.
site_url: https://biola-x.github.io/capstone/

theme:
  name: material
  language: en
  icon:
    logo: material/lightbulb-on
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest

extra_css:
  - stylesheets/biola.css

# Pages not listed in `nav` still build fine — this just silences the warning
# so you can add idea / project / partner files freely.
validation:
  nav:
    omitted_files: ignore
  not_found: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md

  - Engineering Senior Capstone:
      - capstone/index.md
      - Submit a Proposal: capstone/submit.md
      - Project Ideas:
          - capstone/ideas/index.md
          - Idea Template: capstone/ideas/_template.md
          - "01 · Autonomous Campus Delivery Cart": capstone/ideas/idea-01-autonomous-cart.md
          - "02 · Low-Cost Water Quality Sensor Buoy": capstone/ideas/idea-02-water-quality-buoy.md
          - "03 · Adaptive Controller for Accessible Gaming": capstone/ideas/idea-03-adaptive-controller.md
          # Add a line here for each new file in docs/capstone/ideas/

  - Summer Engineering Internships:
      - sei/index.md

  - Industry Partnerships:
      - partnerships/index.md
      - Santa Ynez Fire Department: partnerships/santa-ynez-fire-department.md
      - Water Land Surveying: partnerships/water-land-surveying.md
      - AI Company: partnerships/ai-company.md
      - Space Company: partnerships/space-company.md
      - Defense Tech: partnerships/defense-tech.md
      # Add a line here for each new file in docs/partnerships/

plugins:
  - search
